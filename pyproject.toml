[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chessmaster"
version = "0.1.0"
description = "Real-time on-screen chess assistant: recognizes the board on screen and highlights Stockfish's best move."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "mss>=9.0",
    "chess>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.5",
]

[project.gui-scripts]
chessmaster = "chessmaster.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chessmaster = ["profiles/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
